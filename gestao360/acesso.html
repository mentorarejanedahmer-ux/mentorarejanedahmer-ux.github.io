<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d4b32"><title>Acesso — Gestão 360</title><style>:root{--bg:#f7f3ed;--paper:#fffdf9;--ink:#2d241d;--muted:#786b61;--brown:#6d4b32;--gold:#b99152;--line:#e2d8cc;--ok:#35745b;--danger:#a54e46;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#3e2a1e,#76543a);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(480px,100%);background:var(--paper);border-radius:22px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.22)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--gold);font-weight:800}h1{margin:8px 0 4px}.muted{color:var(--muted);line-height:1.45}.tabs{display:flex;gap:4px;background:#f1ebe2;border-radius:14px;padding:4px;margin:18px 0}.tab{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:10px;font-weight:750;color:var(--muted)}.tab.active{background:white;color:var(--brown)}.pane{display:none}.pane.active{display:block}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:16px}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;margin-top:8px;cursor:pointer}.primary{background:var(--brown);color:#fff}.soft{background:#f1ebe2;color:var(--brown)}.message{padding:11px;border-radius:11px;margin:12px 0;font-size:13px}.ok{background:#e6f2ec;color:var(--ok)}.error{background:#f8e7e5;color:var(--danger)}.buy{border:1px solid var(--line);padding:14px;border-radius:14px;margin:14px 0;background:white}</style></head><body><main class="card"><span class="eyebrow">Re*Nascente RD</span><h1>Gestão 360</h1><p class="muted">Compra, primeiro acesso, senha e login em um único lugar.</p><div class="buy"><strong>Ainda não comprou?</strong><button class="btn primary" id="buy">Comprar acesso pela Kiwify</button></div><div class="tabs"><button class="tab active" data-p="login">Entrar</button><button class="tab" data-p="first">Primeiro acesso</button><button class="tab" data-p="recover">Recuperar senha</button></div><div id="global"></div><section id="login" class="pane active"><form id="f-login"><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Senha</label><input name="password" type="password" required></div><button class="btn primary">Entrar</button></form></section><section id="first" class="pane"><p class="muted">Use exatamente o mesmo e-mail informado na compra da Kiwify.</p><form id="f-first"><div class="field"><label>E-mail da compra</label><input name="email" type="email" required></div><div class="field"><label>Crie sua senha</label><input name="password" type="password" minlength="8" required></div><button class="btn primary">Criar meu acesso</button></form></section><section id="recover" class="pane"><p class="muted">Enviaremos um link para você escolher uma nova senha.</p><form id="f-recover"><div class="field"><label>E-mail</label><input name="email" type="email" required></div><button class="btn primary">Enviar recuperação</button></form></section><section id="newpass" class="pane"><h2>Crie sua senha</h2><form id="f-newpass"><div class="field"><label>Nova senha</label><input name="password" type="password" minlength="8" required></div><button class="btn primary">Salvar senha e entrar</button></form></section><button class="btn soft" id="home">Voltar ao aplicativo</button></main><script>const URL='https://cqpihcfgjocmwaqwiemi.supabase.co',KEY='sb_publishable_kDx8ysTXs-p6J3EN7PNO0Q_on-h2m_r',CHECKOUT='https://pay.kiwify.com.br/CUnAMR0';const g=document.getElementById('global');function msg(t,ok=false){g.innerHTML='<div class="message '+(ok?'ok':'error')+'">'+String(t).replace(/[&<>]/g,'')+'</div>'}function show(id){document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.p===id));document.getElementById(id).classList.add('active');g.innerHTML=''}async function req(path,opt={}){const h={'apikey':KEY};if(opt.token)h.Authorization='Bearer '+opt.token;if(opt.body)h['Content-Type']='application/json';const r=await fetch(URL+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined});const tx=await r.text();let d={};try{d=tx?JSON.parse(tx):{}}catch{d={error:tx}}if(!r.ok)throw new Error(d.error_description||d.msg||d.message||d.error||('Erro '+r.status));return d}function save(d){if(d.access_token)localStorage.setItem('g360_token',d.access_token);if(d.refresh_token)localStorage.setItem('g360_refresh',d.refresh_token)}document.getElementById('buy').onclick=()=>location.href=CHECKOUT;document.getElementById('home').onclick=()=>location.href='./';document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.p));document.getElementById('f-login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);msg('Entrando…',true);try{const d=await req('/auth/v1/token?grant_type=password',{method:'POST',body:{email:String(f.get('email')).trim().toLowerCase(),password:String(f.get('password'))}});save(d);location.href='./'}catch(x){msg('Não foi possível entrar: '+x.message)}};document.getElementById('f-first').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const email=String(f.get('email')).trim().toLowerCase(),password=String(f.get('password'));msg('Validando a compra e criando seu acesso…',true);try{const r=await fetch(URL+'/functions/v1/gestao360-first-access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Compra aprovada não localizada para este e-mail.');const a=await req('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password}});save(a);location.href='./'}catch(x){msg(x.message)}};document.getElementById('f-recover').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const redirect=location.origin+location.pathname;msg('Solicitando recuperação…',true);try{await req('/auth/v1/recover?redirect_to='+encodeURIComponent(redirect),{method:'POST',body:{email:String(f.get('email')).trim().toLowerCase()}});msg('Se este e-mail estiver cadastrado, o link de recuperação será enviado.',true)}catch(x){msg('Não foi possível solicitar: '+x.message)}};document.getElementById('f-newpass').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),token=localStorage.getItem('g360_token');try{await req('/auth/v1/user',{method:'PUT',token,body:{password:String(f.get('password'))}});location.hash='';location.href='./'}catch(x){msg('Não foi possível salvar a senha: '+x.message)}};function hash(){if(!location.hash)return;const q=new URLSearchParams(location.hash.slice(1)),a=q.get('access_token'),r=q.get('refresh_token'),t=q.get('type');if(a){save({access_token:a,refresh_token:r||''});if(t==='invite'||t==='recovery')show('newpass')}}hash();</script></body></html>
