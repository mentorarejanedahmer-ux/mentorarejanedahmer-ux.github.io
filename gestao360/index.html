:root{--bg:#f7f3ed;--paper:#fffdf9;--paper2:#f1ebe2;--ink:#2d241d;--muted:#786b61;--brown:#6d4b32;--dark:#4d3323;--gold:#b99152;--line:#e2d8cc;--ok:#35745b;--danger:#a54e46;--shadow:0 16px 38px rgba(61,42,28,.08);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.page{max-width:1120px;margin:auto;padding:24px 16px 90px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--gold);font-weight:800}.muted{color:var(--muted)}.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}.auth-art{background:linear-gradient(145deg,#3e2a1e,#76543a);color:#fff;padding:8vw;display:flex;flex-direction:column;justify-content:flex-end}.auth-art h1{font-size:clamp(42px,7vw,78px);line-height:.94;margin:12px 0}.auth-art p{max-width:560px;color:#ecdfcf;font-size:18px}.auth-panel{display:grid;place-items:center;padding:24px}.auth-card{width:min(440px,100%);padding:26px}.tabs{display:flex;padding:4px;background:var(--paper2);border-radius:14px;margin-bottom:18px}.tab{flex:1;border:0;background:transparent;padding:10px;border-radius:10px;color:var(--muted);font-weight:700}.tab.active{background:#fff;color:var(--brown);box-shadow:0 5px 14px rgba(0,0,0,.06)}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:800;color:var(--dark)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;outline:none}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:750}.primary{background:var(--brown);color:white}.soft{background:var(--paper2);color:var(--dark)}.ghost{background:transparent;color:var(--brown)}.message{padding:12px;border-radius:12px;margin:12px 0;font-size:13px}.error{background:#f8e7e5;color:var(--danger)}.ok{background:#e6f2ec;color:var(--ok)}.topbar{position:sticky;top:0;z-index:10;background:rgba(247,243,237,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topbar-in{max-width:1120px;margin:auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--brown),var(--dark));display:grid;place-items:center;color:#fff;font-weight:850}.brand small{display:block;color:var(--muted)}.hero{display:grid;grid-template-columns:1.5fr .8fr;gap:14px}.hero>div{padding:22px}.hero h1{font-size:clamp(28px,5vw,48px);margin:6px 0 8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.metrics .row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.metrics .row:last-child{border-bottom:0}.section-head{margin:24px 0 12px}.section-head h2{margin:0}.section-head p{margin:4px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.module{padding:16px;min-height:140px}.module h3{margin:6px 0 6px;font-size:16px}.module p{font-size:13px;color:var(--muted);margin:0}.pill{display:inline-flex;padding:5px 8px;border-radius:99px;background:var(--paper2);font-size:11px;font-weight:750;color:var(--dark)}.onboarding{max-width:760px;margin:30px auto;padding:24px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid var(--line);border-radius:12px;padding:12px;background:white}.scanner{padding:22px}.scanner-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.scan-card{padding:18px;border:1px solid var(--line);border-radius:16px;background:white}.bottom-note{margin-top:14px;background:var(--paper2);border-radius:14px;padding:14px;color:var(--muted);font-size:13px}.mood-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.mood{padding:12px 4px;border:1px solid var(--line);background:white;border-radius:13px;text-align:center}.mood strong{display:block;font-size:22px}.overlay{position:fixed;inset:0;background:rgba(45,36,29,.38);z-index:30;display:grid;place-items:center;padding:16px}.modal{width:min(560px,100%);max-height:92vh;overflow:auto;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.statusbar{font-size:12px;padding:8px 16px;text-align:center;background:#efe7dc;color:var(--dark)}@media(max-width:850px){.auth{grid-template-columns:1fr}.auth-art{min-height:32vh;padding:34px 22px}.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.scanner-grid{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:8px}.module{padding:13px;min-height:132px}.form-row,.choice-grid{grid-template-columns:1fr}.page{padding:16px 12px 80px}.auth-panel{padding:12px}.auth-card{padding:20px}.brand small{display:none}}

<body>
<div id="app"><div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f3ed;color:#2d241d;font-family:system-ui,sans-serif"><div style="max-width:520px;background:#fffdf9;border:1px solid #e2d8cc;border-radius:22px;padding:28px;box-shadow:0 16px 38px rgba(61,42,28,.08)"><div style="text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#b99152;font-weight:800">Re*Nascente RD</div><h1 style="margin:8px 0">Gestão 360 do Comércio</h1><p style="color:#786b61;line-height:1.5">Abrindo o aplicativo…</p><noscript><p style="color:#a54e46">O navegador está com JavaScript desativado. Abra este arquivo no Chrome.</p></noscript></div></div></div>

<script>
const CFG={url:'https://cqpihcfgjocmwaqwiemi.supabase.co',key:'sb_publishable_kDx8ysTXs-p6J3EN7PNO0Q_on-h2m_r',checkout:'https://pay.kiwify.com.br/CUnAMR0'};
const MODULES=[['financial','Financeiro & Caixa','Caixa, recebimentos, pagamentos, conciliação e fechamento.'],['sales','Vendas & Comandas','Balcão, mesas, orçamento, devoluções e vendedores.'],['inventory','Produtos & Estoque','Código de barras, custo, preço de venda e inventário.'],['documents','Biblioteca Fiscal','XML, PDF, fotos, notas de compra e documentos.'],['fiscal','Fiscal & Enquadramento','Obrigações, limites e alertas tributários.'],['people','Pessoas & RH','Funcionários, vendedores, comissão, ponto e metas.'],['marketplace','Online & Marketplace','Taxas, frete, repasses e lucro por canal.'],['customers','Clientes & CRM','Leads, propostas, histórico e relacionamento.'],['suppliers','Fornecedores & Compras','Cotação, pedidos, recebimento e custos.'],['production','Produção & Serviços','Ordens, ficha técnica, agenda e desperdício.'],['nr1','NR-1 / SST','Riscos ocupacionais e psicossociais.'],['iso','ISO & Qualidade','Requisitos, POPs, auditorias e não conformidades.'],['legal','Legislação & Licenças','Alvarás, contratos e vencimentos.'],['assets','Patrimônio & Reformas','Bens, manutenção, obras e investimentos.'],['planning','Metas & Planejamento','Indicadores, cenários e decisões.'],['wellbeing','Consciência & Bem-estar','Check-ins e recursos opcionais.']];
const app=document.getElementById('app');const state={token:localStorage.getItem('g360_token')||'',refreshToken:localStorage.getItem('g360_refresh')||'',user:null,business:null,membership:null,online:navigator.onLine,prefs:JSON.parse(localStorage.getItem('g360_wellbeing_prefs')||'{"level":"off","midday":false}')};
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function api(path,{method='GET',body,auth=true}={}){const headers={'apikey':CFG.key};if(auth&&state.token)headers.Authorization='Bearer '+state.token;if(body!==undefined)headers['Content-Type']='application/json';const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch(CFG.url+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),signal:ctl.signal});const txt=await r.text();let data=null;try{data=txt?JSON.parse(txt):null}catch{data=txt}if(!r.ok)throw new Error((data&&data.message)||(data&&data.error_description)||(data&&data.error)||('Erro '+r.status));return data}finally{clearTimeout(t)}}
function goBuy(){window.location.href=CFG.checkout}
function saveSession(d){state.token=d.access_token||state.token;state.refreshToken=d.refresh_token||state.refreshToken;if(state.token)localStorage.setItem('g360_token',state.token);if(state.refreshToken)localStorage.setItem('g360_refresh',state.refreshToken)}
async function refreshSession(){if(!state.refreshToken)throw new Error('Sessão expirada');const d=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:state.refreshToken}});saveSession(d);return d}
function statusBar(){return `<div class="statusbar">${navigator.onLine?'Conectado à internet':'Modo sem internet — a interface continua disponível'}</div>`}
function setMsg(txt,type='error'){const m=document.getElementById('msg');if(m)m.innerHTML=`<div class="message ${type}">${esc(txt)}</div>`}
function renderAuth(msg=''){app.innerHTML=statusBar()+`<div class="auth"><section class="auth-art"><span class="eyebrow">Re*Nascente RD</span><h1>Gestão 360<br>do Comércio</h1><p>A empresa inteira organizada em um só lugar — com operação simples e inteligência por trás.</p><div class="actions" style="margin-top:24px"><button class="btn" id="buy" style="background:#fff;color:#4d3323;font-size:16px">COMPRAR ACESSO</button></div><p style="font-size:13px;color:#dbcbb9">Pagamento seguro pela Kiwify.</p></section><section class="auth-panel"><div class="card auth-card"><div class="tabs"><button class="tab active" data-tab="login">Já sou cliente</button><button class="tab" data-tab="first">Primeiro acesso</button></div>${msg?`<div class="message error">${esc(msg)}</div>`:''}<div id="login-pane"><h2>Entrar</h2><form id="login"><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Senha</label><input name="password" type="password" required></div><div id="msg"></div><button class="btn primary" style="width:100%">Entrar</button></form></div><div id="first-pane" class="hidden"><h2>Criar meu acesso</h2><p class="muted">Use o mesmo e-mail informado na compra da Kiwify.</p><form id="first"><div class="field"><label>E-mail da compra</label><input name="email" type="email" required></div><div class="field"><label>Crie sua senha</label><input name="password" type="password" minlength="8" required></div><div id="msg-first"></div><button class="btn primary" style="width:100%">Criar acesso</button></form></div></div></section></div>`;document.getElementById('buy').onclick=goBuy;document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('login-pane').classList.toggle('hidden',btn.dataset.tab!=='login');document.getElementById('first-pane').classList.toggle('hidden',btn.dataset.tab!=='first')});document.getElementById('login').onsubmit=login;document.getElementById('first').onsubmit=firstAccess}
async function login(e){e.preventDefault();const f=new FormData(e.target);setMsg('Entrando…','ok');try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email:String(f.get('email')).trim().toLowerCase(),password:String(f.get('password'))}});saveSession(d);await loadUser();await loadContext();render()}catch(err){setMsg('Não foi possível entrar: '+err.message)}}
async function firstAccess(e){e.preventDefault();const f=new FormData(e.target);const m=document.getElementById('msg-first');m.innerHTML='<div class="message ok">Validando sua compra…</div>';try{const r=await fetch(CFG.url+'/functions/v1/gestao360-first-access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:String(f.get('email')).trim().toLowerCase(),password:String(f.get('password'))})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Não foi possível criar o acesso.');m.innerHTML='<div class="message ok">Acesso criado. Entrando…</div>';const a=await api('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email:String(f.get('email')).trim().toLowerCase(),password:String(f.get('password'))}});saveSession(a);await loadUser();await loadContext();render()}catch(err){m.innerHTML='<div class="message error">'+esc(err.message)+'</div>'}}
async function loadUser(){state.user=await api('/auth/v1/user')}
async function loadContext(){const memberships=await api('/rest/v1/business_members?select=business_id,role,status&user_id=eq.'+encodeURIComponent(state.user.id)+'&status=eq.active&limit=1');state.membership=memberships&&memberships[0]||null;if(state.membership){const bs=await api('/rest/v1/businesses?select=*&id=eq.'+encodeURIComponent(state.membership.business_id)+'&limit=1');state.business=bs&&bs[0]||null}}
function render(){if(!state.token||!state.user)return renderAuth();if(!state.business)return renderOnboarding();renderDashboard()}
function renderOnboarding(){app.innerHTML=statusBar()+`<div class="page"><div class="card onboarding"><span class="eyebrow">Primeira configuração</span><h1>Vamos montar o Gestão 360 da sua empresa.</h1><p class="muted">Os módulos são ativados conforme a realidade do negócio. Você não precisa usar tudo.</p><form id="onboard"><div class="form-row"><div class="field"><label>Nome da empresa *</label><input name="trade" required></div><div class="field"><label>CNPJ</label><input name="cnpj"></div></div><div class="form-row"><div class="field"><label>Segmento</label><input name="segment"></div><div class="field"><label>Número de funcionários</label><input name="employees" type="number" min="0" value="0"></div></div><div class="form-row"><div class="field"><label>Cidade</label><input name="city"></div><div class="field"><label>UF</label><input name="state" maxlength="2"></div></div><div class="field"><label>Enquadramento atual</label><select name="tax"><option value="">Selecionar depois</option><option>MEI</option><option>Simples Nacional</option><option>Lucro Presumido</option><option>Lucro Real</option></select></div><h3>Bem-estar e consciência</h3><p class="muted">Este recurso é totalmente opcional. Não é preciso informar religião nem justificar a escolha.</p><div class="choice-grid"><label class="choice"><input type="radio" name="well" value="off" checked> Não quero usar</label><label class="choice"><input type="radio" name="well" value="basic"> Apenas check-ins</label><label class="choice"><input type="radio" name="well" value="awareness"> Check-ins + consciência</label><label class="choice"><input type="radio" name="well" value="systemic"> Também recursos sistêmicos</label></div><div id="onmsg"></div><div class="actions"><button class="btn primary">Criar minha empresa</button><button type="button" class="btn ghost" id="logout">Sair</button></div></form></div></div>`;document.getElementById('onboard').onsubmit=createBusiness;document.getElementById('logout').onclick=logout}
async function createBusiness(e){e.preventDefault();const f=new FormData(e.target);const well=String(f.get('well')||'off');state.prefs={level:well,midday:false};localStorage.setItem('g360_wellbeing_prefs',JSON.stringify(state.prefs));const tax=String(f.get('tax')||'');const payload={p_trade_name:String(f.get('trade')),p_legal_name:null,p_cnpj:String(f.get('cnpj')||'')||null,p_segment:String(f.get('segment')||'')||null,p_city:String(f.get('city')||'')||null,p_state:String(f.get('state')||'').toUpperCase()||null,p_opening_date:null,p_employees_count:Number(f.get('employees')||0),p_has_accountant:null,p_average_monthly_revenue:null,p_target_monthly_revenue:null,p_current_prolabore:null,p_desired_prolabore:null,p_legal_nature_code:null,p_legal_nature_label:null,p_business_size:null,p_tax_regime:tax||null,p_simei:tax==='MEI',p_activity_profile:null,p_primary_activity:null,p_activity_kind:null,p_initial_cash_balance:0};const m=document.getElementById('onmsg');m.innerHTML='<div class="message ok">Criando sua empresa…</div>';try{await api('/rest/v1/rpc/create_business_onboarding_v2',{method:'POST',body:payload});await loadContext();render()}catch(err){m.innerHTML='<div class="message error">'+esc(err.message)+'</div>'}}
function renderDashboard(){const b=state.business;app.innerHTML=statusBar()+`<div class="topbar"><div class="topbar-in"><div class="brand"><div class="mark">360</div><div><strong>Gestão 360</strong><small>${esc(b.trade_name||'Minha empresa')}</small></div></div><div><button class="btn ghost" id="settings">Configurações</button><button class="btn soft" id="logout">Sair</button></div></div></div><main class="page"><section class="hero"><div class="card"><span class="eyebrow">Painel da Empresária</span><h1>O que precisa da sua atenção hoje?</h1><p class="muted">A operação fica simples na tela. A inteligência fica trabalhando por trás.</p><div class="actions"><button class="btn primary" id="open-cash">Abrir caixa</button><button class="btn soft" id="scanner">Escanear</button><button class="btn soft" id="checkin">Check-in</button></div></div><div class="card metrics"><div class="row"><span>Caixa hoje</span><strong>—</strong></div><div class="row"><span>Vendas</span><strong>—</strong></div><div class="row"><span>Estoque baixo</span><strong>—</strong></div><div class="row"><span>Pendências</span><strong>—</strong></div></div></section><div class="section-head"><h2>Áreas da empresa</h2><p>Os módulos aparecem conforme a necessidade do negócio.</p></div><section class="grid">${MODULES.map(m=>`<div class="card module"><span class="pill">${esc(m[0])}</span><h3>${esc(m[1])}</h3><p>${esc(m[2])}</p></div>`).join('')}</section></main>`;document.getElementById('logout').onclick=logout;document.getElementById('scanner').onclick=openScanner;document.getElementById('checkin').onclick=openCheckin;document.getElementById('open-cash').onclick=openCash;document.getElementById('settings').onclick=openSettings}
function modal(html){document.getElementById('modal-root').innerHTML=`<div class="overlay" id="ov"><div class="card modal">${html}</div></div>`;document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')closeModal()}}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function openScanner(){modal(`<div class="modal-head"><div><span class="eyebrow">Central inteligente</span><h2>Escanear</h2></div><button class="btn soft" onclick="closeModal()">Fechar</button></div><p class="muted">Um único ponto de entrada para documentos e produtos.</p><div class="scanner-grid"><div class="scan-card"><h3>Nota fiscal / QR</h3><p class="muted">Leva o documento para a Biblioteca Fiscal e tenta identificar os dados.</p></div><div class="scan-card"><h3>Produto entrando</h3><p class="muted">Código de barras → quantidade → custo de compra → estoque.</p></div><div class="scan-card"><h3>Produto saindo</h3><p class="muted">Código de barras → preço de venda → venda → baixa do estoque.</p></div></div><div class="bottom-note">A interface está preparada; a câmera/leitor físico ainda precisa ser conectada à rotina de estoque e fiscal.</div>`)}
function openCash(){modal(`<div class="modal-head"><div><span class="eyebrow">Caixa do dia</span><h2>Abertura</h2></div><button class="btn soft" onclick="closeModal()">Fechar</button></div><div class="field"><label>Saldo inicial</label><input type="number" step="0.01" placeholder="R$ 0,00"></div>${state.prefs.level!=='off'?'<p class="muted">Antes de começar, um check-in rápido e opcional:</p><div class="mood-grid"><button class="mood"><strong>😌</strong><small>Centrada</small></button><button class="mood"><strong>🙂</strong><small>Bem</small></button><button class="mood"><strong>😐</strong><small>Cansada</small></button><button class="mood"><strong>😣</strong><small>Sobrecarregada</small></button><button class="mood"><strong>😞</strong><small>Difícil</small></button></div>':''}<div class="actions"><button class="btn primary" onclick="closeModal()">Continuar</button></div>`)}
function openCheckin(){if(state.prefs.level==='off'){modal(`<div class="modal-head"><h2>Consciência e bem-estar</h2><button class="btn soft" onclick="closeModal()">Fechar</button></div><p>Este recurso está desativado para sua empresa.</p><p class="muted">A dona pode ativar quando quiser. Não é obrigatório e não exige informar religião.</p>`);return}modal(`<div class="modal-head"><div><span class="eyebrow">Check-in humano</span><h2>Como você está agora?</h2></div><button class="btn soft" onclick="closeModal()">Fechar</button></div><div class="mood-grid"><button class="mood"><strong>😌</strong><small>Centrada</small></button><button class="mood"><strong>🙂</strong><small>Bem</small></button><button class="mood"><strong>😐</strong><small>Cansada</small></button><button class="mood"><strong>😣</strong><small>Sobrecarregada</small></button><button class="mood"><strong>😞</strong><small>Difícil</small></button></div><div class="bottom-note">O sistema registra tendências para a própria empresária sem diagnosticar condições psicológicas.</div>`)}
function openSettings(){modal(`<div class="modal-head"><div><span class="eyebrow">Configurações</span><h2>Preferências</h2></div><button class="btn soft" onclick="closeModal()">Fechar</button></div><div class="field"><label>Consciência e bem-estar</label><select id="pref"><option value="off" ${state.prefs.level==='off'?'selected':''}>Não usar</option><option value="basic" ${state.prefs.level==='basic'?'selected':''}>Check-ins</option><option value="awareness" ${state.prefs.level==='awareness'?'selected':''}>Check-ins + consciência</option><option value="systemic" ${state.prefs.level==='systemic'?'selected':''}>Também recursos sistêmicos</option></select></div><div class="actions"><button class="btn primary" id="savepref">Salvar</button></div><div class="bottom-note">A conta e os dados ficam no Supabase, independentes deste chat.</div>`);document.getElementById('savepref').onclick=()=>{state.prefs.level=document.getElementById('pref').value;localStorage.setItem('g360_wellbeing_prefs',JSON.stringify(state.prefs));closeModal()}}
function logout(){localStorage.removeItem('g360_token');localStorage.removeItem('g360_refresh');state.token='';state.refreshToken='';state.user=null;state.business=null;state.membership=null;renderAuth()}
function renderInvitePassword(){app.innerHTML=statusBar()+`<div class="auth"><section class="auth-art"><span class="eyebrow">Re*Nascente RD</span><h1>Gestão 360<br>do Comércio</h1><p>Sua compra foi liberada. Agora crie sua senha para entrar.</p></section><section class="auth-panel"><div class="card auth-card"><span class="eyebrow">Acesso liberado</span><h2>Crie sua senha</h2><form id="invite-pass"><div class="field"><label>Nova senha</label><input name="password" type="password" minlength="8" required></div><div id="msg"></div><button class="btn primary" style="width:100%">Salvar senha e entrar</button></form></div></section></div>`;document.getElementById('invite-pass').onsubmit=async(e)=>{e.preventDefault();const pwd=String(new FormData(e.target).get('password')||'');setMsg('Salvando sua senha…','ok');try{await api('/auth/v1/user',{method:'PUT',body:{password:pwd}});history.replaceState(null,'',location.pathname+location.search);await loadUser();await loadContext();render()}catch(err){setMsg('Não foi possível definir a senha: '+err.message,'error')}}}
function handleAuthHash(){if(!location.hash)return false;const q=new URLSearchParams(location.hash.slice(1));const at=q.get('access_token'),rt=q.get('refresh_token'),type=q.get('type');if(at){saveSession({access_token:at,refresh_token:rt||''});if(type==='invite'||type==='recovery'){renderInvitePassword();return true}}return false}
async function boot(){if(handleAuthHash())return;renderAuth();if(!state.token)return;try{await loadUser();await loadContext();render()}catch(e){try{await refreshSession();await loadUser();await loadContext();render()}catch(_){localStorage.removeItem('g360_token');localStorage.removeItem('g360_refresh');state.token='';state.refreshToken='';state.user=null;renderAuth('Sua sessão anterior expirou. Entre novamente.')}}}
window.addEventListener('online',()=>{state.online=true;render()});window.addEventListener('offline',()=>{state.online=false;render()});if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}boot();
</script>
</body>
</html>
