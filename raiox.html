<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raio-X</title><style>:root{--rose:#a55f62;--gold:#b68c51;--ink:#2c2223;--muted:#75696b;--bg:#f7f2ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.box{max-width:630px;margin:0 auto;padding:28px 16px 44px}.card{background:#fff;border:1px solid #e8ddd8;border-radius:20px;padding:22px;margin:12px 0}h1{font-size:31px;line-height:1.1;margin:0 0 15px}p{line-height:1.5}.muted{color:var(--muted);font-size:14px}label{display:block;font-weight:bold;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #d9cfca;border-radius:10px;font-size:16px}.opt{display:block;border:1px solid #e5d9d3;border-radius:12px;padding:13px;margin:8px 0;font-weight:normal}.opt input{width:auto;margin-right:8px}button{width:100%;border:0;border-radius:12px;padding:15px;background:var(--gold);color:#fff;font-size:16px;font-weight:bold;margin-top:18px}.hidden{display:none}#error{color:#8b3030}.tag{color:var(--rose);font-weight:bold;font-size:13px}</style><body><main class="box"><div id="loading" class="card">Carregando seu Raio-X…</div><form id="form" class="hidden"><div class="card"><div class="tag">RAIO-X DA EMPRESÁRIA</div><h1 id="title"></h1><p id="promise"></p><label>Seu nome</label><input id="name" required maxlength="140" autocomplete="name"><label>Seu melhor e-mail</label><input id="email" type="email" required maxlength="254" autocomplete="email"><p class="muted"><label class="opt"><input id="consent" type="checkbox" required> <span id="privacy"></span></label><label class="opt"><input id="marketing" type="checkbox"> Quero também receber conteúdos e informações.</label></p></div><div id="questions"></div><p id="error"></p><button id="submit">VER MEU RESULTADO</button></form><section id="result" class="hidden"><div class="card"><div class="tag">SEU RESULTADO PRELIMINAR</div><h1 id="rtitle"></h1><p id="rdesc"></p><div id="points" class="muted"></div><p><b>Próximo passo:</b> uma conversa profissional para entender o seu cenário e decidir o que precisa ser priorizado.</p><a id="offer" class="hidden"><button id="offerText"></button></a><p id="unavailable" class="muted"></p></div></section></main><script>const BASE='https://vjpcivbmnhqapbrlqeli.supabase.co/functions/v1/machine-automatic-clients';let cfg,slug;const e=id=>document.getElementById(id);function esc(x){return String(x??'').replace(/[&<>'"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]))}function source(){let q=new URLSearchParams(location.search);return{utm_source:q.get('utm_source')||'',utm_campaign:q.get('utm_campaign')||'',referrer:document.referrer||''}}async function start(){slug=new URLSearchParams(location.search).get('f')||'';if(!slug){e('loading').textContent='Este link do Raio-X não é válido.';return}let r=await fetch(BASE+'?action=public&slug='+encodeURIComponent(slug));let a=await r.json();if(!r.ok){e('loading').textContent='Este Raio-X não está disponível neste momento.';return}cfg=a.config;e('title').textContent=cfg.landing?.title||'Raio-X';e('promise').textContent=cfg.landing?.promise||'';e('privacy').textContent=cfg.landing?.privacy||'Autorizo o uso dos meus dados para receber este resultado.';e('questions').innerHTML=(cfg.questions||[]).map((q,i)=>'<div class="card"><b>'+esc((i+1)+'. '+q.text)+'</b>'+(q.options||[]).map(o=>'<label class="opt"><input required type="radio" name="'+esc(q.id)+'" value="'+esc(o[0])+'"> '+esc(o[0])+'</label>').join('')+'</div>').join('');e('loading').classList.add('hidden');e('form').classList.remove('hidden')}e('form').addEventListener('submit',async ev=>{ev.preventDefault();e('submit').disabled=true;e('error').textContent='Preparando seu resultado…';let answers={};for(let q of cfg.questions||[])answers[q.id]=new FormData(e('form')).get(q.id);let r=await fetch(BASE+'?action=submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({slug,name:e('name').value,email:e('email').value,consent:e('consent').checked,marketing:e('marketing').checked,answers,source:source()})});let a=await r.json();if(!r.ok){e('error').textContent='Não foi possível concluir agora. Confira os dados e tente de novo.';e('submit').disabled=false;return}e('rtitle').textContent='Seu principal gargalo hoje está em '+a.result.primary_title+'.';e('rdesc').textContent=a.result.description;e('points').innerHTML='<b>Pontos para olhar:</b><br>'+a.result.points.map(esc).join('<br>');let of=a.offer||{};if(of.checkout_url){e('offer').href=of.checkout_url;e('offerText').textContent=of.cta||'QUERO MEU DIAGNÓSTICO';e('offer').classList.remove('hidden')}else e('unavailable').textContent='A agenda do diagnóstico será liberada em breve.';e('form').classList.add('hidden');e('result').classList.remove('hidden')});start()</script></body></html>
