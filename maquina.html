<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Máquina Automática de Clientes</title><style>body{margin:0;background:#f7f2ee;color:#2c2223;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e8ddd8;border-radius:18px;padding:16px;margin:12px 0}input,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;font:inherit;margin:5px 0 12px}textarea{min-height:80px}button{border:0;border-radius:10px;padding:12px;background:#a55f62;color:#fff;font-weight:bold;margin:4px}.gray{background:#75696b}.gold{background:#b68c51}.hidden{display:none}.muted{color:#75696b;font-size:14px}.metric{display:inline-block;width:145px;padding:12px;margin:5px;background:#fff;border-radius:12px;text-align:center}.metric b{display:block;font-size:24px}</style><body><main class="wrap"><div id="login" class="card"><h1>Máquina Automática de Clientes</h1><p>Entre pelo Social Seller para configurar seu funil.</p><button onclick="location.href='/'">ABRIR SOCIAL SELLER</button></div><section id="app" class="hidden"><div class="card"><button class="gray" onclick="location.href='/'">← Social Seller</button><h1>Máquina Automática de Clientes</h1><p class="muted">Configure, salve e publique. Seus dados e leads ficam só na sua conta.</p><p><b>Link público:</b> <a id="link" target="_blank"></a></p><button class="gray" onclick="navigator.clipboard.writeText(e('link').href)">COPIAR LINK</button></div><div class="card"><h2>Página de captação</h2><label>Título</label><textarea id="title"></textarea><label>Promessa</label><textarea id="promise"></textarea><label>Texto do botão</label><input id="cta"><label>Texto de consentimento</label><textarea id="privacy"></textarea></div><div class="card"><h2>Oferta do diagnóstico</h2><label>Nome</label><input id="offerTitle"><label>Descrição</label><textarea id="offerDescription"></textarea><label>Preço e duração</label><input id="offerPrice" placeholder="Ex.: R$ 497 · 60 minutos"><label>Link do checkout</label><input id="checkout" placeholder="Será conectado quando o pagamento do diagnóstico for criado"><label>Link da agenda</label><input id="calendar" placeholder="Será conectado depois do calendário"><button onclick="save()">SALVAR RASCUNHO</button><button class="gold" onclick="publish()">PUBLICAR PÁGINA</button><span id="status" class="muted"></span></div><div class="card"><h2>Leads e CRM</h2><div id="metrics"></div><div id="leads"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script><script>const url='https://vjpcivbmnhqapbrlqeli.supabase.co',key='sb_publishable_KAEYQhr92si-oeFd03qINQ_5WXTU423',sb=supabase.createClient(url,key),BASE=url+'/functions/v1/machine-automatic-clients',e=id=>document.getElementById(id);let f;async function api(action,body){let{data:{session}}=await sb.auth.getSession();let r=await fetch(BASE+'?action='+action,{method:body?'POST':'GET',headers:{authorization:'Bearer '+session.access_token,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});return[r,await r.json()]}function fill(){let d=f.draft,l=d.landing||{},o=d.offer||{};e('title').value=l.title||'';e('promise').value=l.promise||'';e('cta').value=l.cta||'';e('privacy').value=l.privacy||'';e('offerTitle').value=o.title||'';e('offerDescription').value=o.description||'';e('offerPrice').value=o.price||'';e('checkout').value=o.checkout_url||'';e('calendar').value=o.calendar_url||''}function draft(){let d=structuredClone(f.draft);d.landing={...d.landing,title:e('title').value,promise:e('promise').value,cta:e('cta').value,privacy:e('privacy').value};d.offer={...d.offer,title:e('offerTitle').value,description:e('offerDescription').value,price:e('offerPrice').value,checkout_url:e('checkout').value,calendar_url:e('calendar').value};return d}async function save(){e('status').textContent='Salvando…';let[r,a]=await api('save',{draft:draft()});if(r.ok){f=a.funnel;e('status').textContent='Rascunho salvo.'}else e('status').textContent='Não consegui salvar agora.'}async function publish(){await save();e('status').textContent='Publicando…';let[r,a]=await api('publish',{});e('status').textContent=r.ok?'Página publicada.':'Não consegui publicar.';if(r.ok){e('link').href=a.link;e('link').textContent=a.link}}async function leads(){let{data, error}=await sb.from('acquisition_entries').select('name,email,stage,result,created_at').order('created_at',{ascending:false});if(error)return;let n=data.length,q=data.filter(x=>x.stage==='qualificado').length;e('metrics').innerHTML='<span class="metric"><b>'+n+'</b>leads</span><span class="metric"><b>'+q+'</b>qualificados</span>';e('leads').innerHTML=data.slice(0,12).map(x=>'<p><b>'+x.name+'</b> · '+x.stage+'<br><span class="muted">'+(x.result?.primary_title||'')+'</span></p>').join('')||'<p class="muted">Ainda não há leads.</p>'}async function start(){let{data:{session}}=await sb.auth.getSession();if(!session)return;let[r,a]=await api('owner');if(!r.ok)return;f=a.funnel;e('link').href=a.link;e('link').textContent=a.link;e('login').classList.add('hidden');e('app').classList.remove('hidden');fill();leads()}start()</script></body></html>
